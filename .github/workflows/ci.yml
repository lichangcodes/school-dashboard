name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # All runs share one test database, and each run wipes it. Queue them
    # instead of letting two runs truncate tables under each other.
    concurrency:
      group: backend-test-db
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p . && npx tsc -p tests
      - name: Test
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Typecheck and build
        run: npm run build
